[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/ttl-sign-core",
    "crates/ttl-sign-server",
    "crates/ttl-sign-replay",
    "crates/ttl-sign-lab",
    "crates/ttl-sign-native",
    "crates/ttl-fixture-hygiene",
    "crates/ttl-live-discovery",
    "crates/ttl-sign-headless",
    "crates/ttl-sign-embedded",
    "crates/ttl-live-ws",
    "crates/ttl-live-proto",
    "crates/ttl-live-events",
]
default-members = [
    "crates/ttl-sign-core",
    "crates/ttl-sign-server",
    "crates/ttl-sign-replay",
    "crates/ttl-sign-lab",
    "crates/ttl-sign-native",
    "crates/ttl-fixture-hygiene",
    "crates/ttl-live-discovery",
    "crates/ttl-sign-headless",
    "crates/ttl-sign-embedded",
    "crates/ttl-live-ws",
    "crates/ttl-live-proto",
    "crates/ttl-live-events",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/nglmercer/tiktok-signer"

[workspace.dependencies]
ttl-sign-core = { path = "crates/ttl-sign-core" }
ttl-sign-replay = { path = "crates/ttl-sign-replay" }
ttl-sign-lab = { path = "crates/ttl-sign-lab" }
ttl-sign-native = { path = "crates/ttl-sign-native" }
ttl-live-discovery = { path = "crates/ttl-live-discovery" }
ttl-sign-headless = { path = "crates/ttl-sign-headless" }
ttl-sign-embedded = { path = "crates/ttl-sign-embedded" }
ttl-live-ws = { path = "crates/ttl-live-ws" }
ttl-live-proto = { path = "crates/ttl-live-proto" }
ttl-live-events = { path = "crates/ttl-live-events" }

anyhow = "1"
base64 = "0.22"
bytes = "1"
flate2 = "1"
prost = "0.14.3"
prost-build = "0.14.3"
prost-types = "0.14.3"
protoc-bin-vendored = "3.2.0"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
