services:
  sign-server:
    build: .
    # Bind to loopback on the host and put a reverse proxy in front; the server has no
    # authentication of its own.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TTL_BIND: "0.0.0.0:8080"
      TTL_MAX_CONCURRENT: "2"
      RUST_LOG: "ttl_sign_server=info,ttl_sign_headless=info"
    # Required, not optional: `/webcast/im/fetch/` answers a guest with an empty body, so the
    # server refuses to start without an account session. Provide it as a cookie header
    # (`name=value; ...`) containing at least `sessionid`, exported from a logged-in browser.
    volumes:
      - ./session:/home/signer/.config/ttl-signer/session:ro
    restart: unless-stopped
    init: true
