[package]
name = "ttl-sign-headless"
description = "Browser-free SignerBackend: signs the transport with an external signer process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ttl-sign-core = { workspace = true }
ttl-live-discovery = { workspace = true }

reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip"] }
tracing = { workspace = true }

[dev-dependencies]
# Tests and doctests build clients without an application-installed provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
