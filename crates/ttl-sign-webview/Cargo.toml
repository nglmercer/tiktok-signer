[package]
name = "ttl-sign-webview"
description = "Motor de firma: webview wry que deja que la propia página de TikTok firme la petición."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ttl-sign-core = { workspace = true }

base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

tao = "0.36"
wry = "0.56"

[dev-dependencies]
ttl-live-ws = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[example]]
name = "live-check"
path = "examples/live-check.rs"
