[package]
name = "ttl-sign-webview"
description = "Signing engine: a Wry WebView that lets TikTok's page sign the request."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ttl-sign-core = { workspace = true }

base64 = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

tao = "0.36"
wry = "0.56"

[dev-dependencies]
ttl-live-ws = { workspace = true }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[example]]
name = "live-check"
path = "examples/live-check.rs"

[[example]]
name = "schema-check"
path = "examples/schema-check.rs"

[[example]]
name = "page-probe"
path = "examples/page-probe.rs"

[[example]]
name = "endpoint-probe"
path = "examples/endpoint-probe.rs"

[[example]]
name = "login"
path = "examples/login.rs"

[[example]]
name = "fetch-dump"
path = "examples/fetch-dump.rs"

[[example]]
name = "ws-probe"
path = "examples/ws-probe.rs"

[[example]]
name = "observe"
path = "examples/observe.rs"
