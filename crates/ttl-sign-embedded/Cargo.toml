[package]
name = "ttl-sign-embedded"
description = "Signs in-process by running the real bundle in an embedded QuickJS engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ttl-live-discovery = { workspace = true }

rand = { workspace = true }
rquickjs = { version = "0.14" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
