[package]
name = "ttl-live-discovery"
description = "Native, browser-free discovery for the unsigned TikTok LIVE endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Run `live-check`'s embedded signer in V8 rather than QuickJS, matching the sign server's own
# `--features v8`. Affects the example only; the library never embeds an engine.
v8 = ["ttl-sign-embedded/v8"]

[dependencies]
ttl-sign-core = { workspace = true }

serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ttl-sign-embedded = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
ttl-sign-core = { workspace = true }
ttl-sign-headless = { workspace = true }
ttl-live-ws = { workspace = true }
ttl-live-events = { workspace = true }
