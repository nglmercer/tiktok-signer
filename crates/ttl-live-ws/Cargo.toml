[package]
name = "ttl-live-ws"
description = "TikTok LIVE WebSocket client built on a signed SignedFetch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ttl-sign-core = { workspace = true }

flate2 = { workspace = true }
futures-util = "0.3"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }

[[example]]
name = "replay"
path = "examples/replay.rs"

[[example]]
name = "rooms"
path = "examples/rooms.rs"
