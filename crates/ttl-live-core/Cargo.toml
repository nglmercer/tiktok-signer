[package]
name = "ttl-live-core"
description = "Shared cancellable LIVE transport and complete batch dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ttl-sign-core.workspace = true
ttl-live-ws.workspace = true
ttl-live-events.workspace = true
tokio = { workspace = true, features = ["rt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
prost.workspace = true
futures-util = "0.3"
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
tokio-tungstenite = "0.24"
ttl-live-proto.workspace = true
