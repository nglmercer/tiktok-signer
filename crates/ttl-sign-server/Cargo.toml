[package]
name = "ttl-sign-server"
description = "HTTP server compatible with the Euler Stream sign-server specification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ttl-sign-headless-server"
path = "src/headless_main.rs"
required-features = ["headless"]

[[bin]]
name = "ttl-sign-replay-server"
path = "src/replay_main.rs"
required-features = ["replay"]

[features]
default = []
replay = ["dep:ttl-sign-replay"]
headless = ["dep:ttl-sign-headless", "dep:ttl-live-discovery", "dep:ttl-sign-embedded"]
# Sign in V8 rather than QuickJS: ~9x the throughput, ~67 MB more binary.
v8 = ["ttl-sign-embedded?/v8"]

[dependencies]
ttl-sign-core = { workspace = true }
ttl-sign-replay = { workspace = true, optional = true }
ttl-sign-headless = { workspace = true, optional = true }
ttl-sign-embedded = { workspace = true, optional = true }
ttl-live-discovery = { workspace = true, optional = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

axum = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ttl-sign-replay = { workspace = true }
ttl-sign-native = { workspace = true }
