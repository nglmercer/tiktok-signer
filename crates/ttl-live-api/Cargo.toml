[package]
name = "ttl-live-api"
description = "A TikTok LIVE connection-ticket broker for direct SDK WebSocket connections."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ttl-live-api"
path = "src/main.rs"

[features]
default = []

[dependencies]
ttl-sign-core = { workspace = true }
ttl-live-discovery = { workspace = true }
ttl-sign-headless = { workspace = true }
ttl-sign-embedded = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Browser relay (`GET /v1/live`): the page cannot set Cookie/User-Agent on a
# TikTok handshake, so the broker dials with the ticket headers and pipes bytes.
futures-util = "0.3"
http = "1"
serde_urlencoded = "0.7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
