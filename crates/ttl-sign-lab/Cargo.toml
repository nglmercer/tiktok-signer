[package]
name = "ttl-sign-lab"
description = "Research-only differential laboratory for signer backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ttl-sign-lab"

[[bin]]
name = "ttl-sign-lab"
path = "src/main.rs"

[[bin]]
name = "ttl-sign-plan"
path = "src/plan_main.rs"

[[bin]]
name = "ttl-sign-observation-diff"
path = "src/observation_diff_main.rs"

[[bin]]
name = "ttl-sign-oracle"
path = "src/oracle_main.rs"
required-features = ["webview"]

[[bin]]
name = "ttl-sign-oracle-replay"
path = "src/oracle_replay_main.rs"
required-features = ["webview"]

[[bin]]
name = "ttl-sign-url-oracle"
path = "src/url_oracle_main.rs"
required-features = ["webview"]

[[bin]]
name = "ttl-sign-url-diff"
path = "src/url_diff_main.rs"

[[bin]]
name = "ttl-sign-trace"
path = "src/signing_trace_main.rs"
required-features = ["webview"]

[[bin]]
name = "ttl-sign-trace-diff"
path = "src/signing_trace_diff_main.rs"

[[bin]]
name = "ttl-sign-paired-trace"
path = "src/paired_trace_main.rs"
required-features = ["webview"]

[[bin]]
name = "ttl-sign-vm-trace"
path = "src/vm_trace_main.rs"
required-features = ["webview"]

[features]
default = []
webview = ["dep:reqwest", "dep:ttl-sign-webview", "dep:tracing-subscriber"]

[dependencies]
ttl-sign-core = { workspace = true }
ttl-sign-replay = { workspace = true }
ttl-sign-webview = { workspace = true, optional = true }

anyhow = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
