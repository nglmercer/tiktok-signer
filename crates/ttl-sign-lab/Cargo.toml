[package]
name = "ttl-sign-lab"
description = "Research-only differential laboratory for signer backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ttl-sign-lab"

[[bin]]
name = "ttl-sign-lab"
path = "src/main.rs"

[[bin]]
name = "ttl-sign-plan"
path = "src/plan_main.rs"

[[bin]]
name = "ttl-sign-observation-diff"
path = "src/observation_diff_main.rs"

[[bin]]
name = "ttl-sign-url-diff"
path = "src/url_diff_main.rs"

[[bin]]
name = "ttl-sign-trace-diff"
path = "src/signing_trace_diff_main.rs"

[[bin]]
name = "ttl-sign-subgraph"
path = "src/subgraph_main.rs"

[[bin]]
name = "ttl-sign-subgraph-diff"
path = "src/subgraph_diff_main.rs"

[features]
default = []

[dependencies]
ttl-sign-core = { workspace = true }
ttl-sign-replay = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
