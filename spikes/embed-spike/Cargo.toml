# Throwaway: measures the engines that did not ship against one acceptance test. V8 moved into
# `crates/ttl-sign-embedded` behind `--features v8`, and its numbers now come from that crate's
# `tests/latency.rs`, so it is no longer here. Not a workspace member, and
# nothing here is meant to be merged — the result is a table, not code.
[package]
name = "embed-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Detached from the workspace on purpose: these dependencies are heavy and must not enter the
# lockfile of anything that ships.
[workspace]

[features]
quickjs = ["dep:rquickjs"]
boa = ["dep:boa_engine"]

[dependencies]
rquickjs = { version = "0.12", optional = true }
boa_engine = { version = "0.21", optional = true }

[[bin]]
name = "embed-spike"
path = "main.rs"
