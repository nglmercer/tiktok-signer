# Throwaway: measures candidate engines against one acceptance test. QuickJS is the only engine
# that ships (`crates/ttl-sign-embedded`); Boa is kept here only to re-derive its failing row in
# `docs/13-embedded-runtime.md`. Not a workspace member, and
# nothing here is meant to be merged — the result is a table, not code.
[package]
name = "embed-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Detached from the workspace on purpose: these dependencies are heavy and must not enter the
# lockfile of anything that ships.
[workspace]

[features]
quickjs = ["dep:rquickjs"]
boa = ["dep:boa_engine"]

[dependencies]
rquickjs = { version = "0.12", optional = true }
boa_engine = { version = "0.21", optional = true }

[[bin]]
name = "embed-spike"
path = "main.rs"
