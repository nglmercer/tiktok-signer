name: Java embedded backend
on:
  pull_request:
    paths: ['sdk/java/**', 'crates/ttl-sign-embedded/bootstrap.js', 'crates/ttl-sign-mobile/**', 'fixtures/research/pinned-signatures-*.json', '.github/workflows/java-embedded.yml']
  push:
    branches: [main]
    paths: ['sdk/java/**', 'crates/ttl-sign-embedded/bootstrap.js', 'crates/ttl-sign-mobile/**', 'fixtures/research/pinned-signatures-*.json', '.github/workflows/java-embedded.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm]
        java: ['17', '21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: buildjdk
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v6
        id: testjdk
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'
      # The embedded backend signs in QuickJS through the Rust JNI library.
      - name: Build the QuickJS JNI library
        shell: bash
        run: |
          cargo build --locked -p ttl-sign-mobile --features jni
          case "$RUNNER_OS" in
            Windows) lib="target/debug/ttl_sign_mobile.dll" ;;
            macOS) lib="target/debug/libttl_sign_mobile.dylib" ;;
            *) lib="target/debug/libttl_sign_mobile.so" ;;
          esac
          path="$PWD/$lib"
          if [ "$RUNNER_OS" = Windows ]; then path="$(cygpath -w "$path")"; fi
          echo "TTL_NATIVE_LIBRARY=$path" >> "$GITHUB_ENV"
      - name: Offline Java tests (no bundle or live network)
        shell: bash
        working-directory: sdk/java
        env:
          JAVA_HOME: ${{ steps.buildjdk.outputs.path }}
          TEST_JAVA_HOME: ${{ steps.testjdk.outputs.path }}
          TEST_JAVA_VERSION: ${{ matrix.java }}
        run: |
          if [ "$TEST_JAVA_VERSION" = 17 ]; then
            ./gradlew :live-core:test :live-client:test :live-presence:test "-PjavaTestHome=$TEST_JAVA_HOME"
          else
            ./gradlew build "-PjavaTestHome=$TEST_JAVA_HOME"
          fi
