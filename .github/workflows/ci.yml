name: headless-ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install workspace Rust toolchain
        run: |
          rustup toolchain install 1.86 --profile minimal --component rustfmt --component clippy
          rustup default 1.86
      - name: Verify default dependency graph is browser-free
        run: |
          if cargo tree -p ttl-sign-server --no-default-features | grep -q 'wry v'; then
            echo 'default sign-server unexpectedly depends on Wry'
            exit 1
          fi
          if cargo tree -p ttl-live-discovery | grep -q 'wry v'; then
            echo 'native discovery unexpectedly depends on Wry'
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Validate the committed controlled research plan
        run: cargo run -p ttl-sign-lab --bin ttl-sign-plan -- fixtures/research/plan.example.json
