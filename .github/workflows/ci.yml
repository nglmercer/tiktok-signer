name: headless-ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/tiktok-live/package-lock.json
      - name: Install Node LIVE package dependencies
        working-directory: packages/tiktok-live
        run: npm ci
      - name: Check Node LIVE package
        working-directory: packages/tiktok-live
        run: npm run check
      - name: Install workspace Rust toolchain
        run: |
          rustup toolchain install 1.86 --profile minimal --component rustfmt --component clippy
          rustup default 1.86
      - name: Verify the workspace is browser-free
        run: |
          # The WebView is gone; nothing may reintroduce it. This checks the whole workspace
          # with every feature enabled, not just one target, so a new optional dependency
          # cannot slip a browser back in.
          if cargo tree --workspace --all-features | grep -qE 'wry v|webkit2gtk'; then
            echo 'the workspace unexpectedly depends on a browser engine'
            cargo tree --workspace --all-features | grep -E 'wry v|webkit2gtk'
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Validate the committed controlled research plan
        run: cargo run -p ttl-sign-lab --bin ttl-sign-plan -- fixtures/research/plan.example.json
