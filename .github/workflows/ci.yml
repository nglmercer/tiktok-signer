name: headless-ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/tiktok-live/package-lock.json
      - name: Install Node LIVE package dependencies
        working-directory: packages/tiktok-live
        run: npm ci
      - name: Check Node LIVE package
        working-directory: packages/tiktok-live
        run: npm run check
      - name: Check broker-backed Node SDK
        working-directory: packages/live-sdk
        run: |
          npm ci
          npm run build
          npm test
      - name: Smoke-test offline Node decoding benchmark
        working-directory: packages/tiktok-live
        run: |
          node scripts/decode-bench.mjs 100
          node scripts/lifecycle-soak.mjs 3
      - name: Install workspace Rust toolchain
        run: |
          rustup toolchain install 1.88 --profile minimal --component rustfmt --component clippy
          rustup default 1.88
      - name: Verify the workspace is browser-free
        run: |
          # The WebView is gone; nothing may reintroduce it. This checks the whole workspace
          # with every feature enabled, not just one target, so a new optional dependency
          # cannot slip a browser back in.
          if cargo tree --workspace --all-features | grep -qE 'wry v|webkit2gtk'; then
            echo 'the workspace unexpectedly depends on a browser engine'
            cargo tree --workspace --all-features | grep -E 'wry v|webkit2gtk'
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Smoke-test offline Rust benchmarks
        run: |
          cargo run -p ttl-live-events --example decode_bench -- normalized 100
          cargo run -p ttl-live-native --example event_bench -- metadata 100
          TTL_SOAK_SECONDS=3 cargo test -p ttl-live-native --lib offline_callback_lifecycle_soak -- --ignored
      - name: Check the Android JNI boundary
        # The `jni`/`live` features are off by default, so the lines above never compile them.
        run: |
          cargo clippy -p ttl-sign-mobile --all-targets --features jni,live -- -D warnings
          cargo test -p ttl-sign-mobile --features jni,live
      - name: Validate the committed controlled research plan
        run: cargo run -p ttl-sign-lab --bin ttl-sign-plan -- fixtures/research/plan.example.json

  java-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'
      - name: Build host JNI library for offline ownership tests
        run: cargo build -p ttl-sign-mobile --features jni,live
      - name: Build Java SDK and examples; run offline parity and lifecycle tests
        working-directory: sdk/java
        env:
          TTL_NATIVE_LIBRARY: ${{ github.workspace }}/target/debug/libttl_sign_mobile.so
        run: ./gradlew build publishToMavenLocal --console=plain

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, and lint Android app
        working-directory: android
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
