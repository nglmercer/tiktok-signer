name: ttl-live-native
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native_file: libttl_live.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native_file: libttl_live.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            native_file: ttl_live.dll
          - os: macos-15-intel
            target: x86_64-apple-darwin
            native_file: libttl_live.dylib
          - os: macos-15
            target: aarch64-apple-darwin
            native_file: libttl_live.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rust decoding, catalog, lifecycle and transport tests
        run: cargo test --locked -p ttl-live-native -p ttl-live-events -p ttl-live-proto -p ttl-live-core --target ${{ matrix.target }}
      - name: Build both native library formats
        run: cargo build --locked --release -p ttl-live-native --target ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compile C ABI layout assertions against the public headers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cl /nologo /std:c11 /W4 /WX /I crates/ttl-live-native/include \
              sdk/dotnet/tests/native/abi_layout.c /Fe:ttl-dotnet-abi-layout.exe
            ./ttl-dotnet-abi-layout.exe
          else
            cc -std=c11 -Wall -Wextra -Werror -Icrates/ttl-live-native/include \
              sdk/dotnet/tests/native/abi_layout.c -o /tmp/ttl-dotnet-abi-layout
            /tmp/ttl-dotnet-abi-layout
          fi
      - name: .NET ABI and offline SDK tests
        shell: bash
        env:
          TTL_LIVE_NATIVE_LIBRARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.native_file }}
        run: |
          python sdk/dotnet/tools/check-abi-coverage.py
          dotnet test sdk/dotnet/tests/Ttl.Live.Tests/Ttl.Live.Tests.csproj --configuration Release
      - name: Verify Linux/macOS C and C++ linkage and exported ABI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          libdir="$PWD/target/${{ matrix.target }}/release"
          cc -std=c11 -Wall -Wextra -Werror -Icrates/ttl-live-native/include crates/ttl-live-native/tests/smoke.c -L"$libdir" -lttl_live -Wl,-rpath,"$libdir" -o /tmp/ttl-native-c
          /tmp/ttl-native-c
          c++ -x c++ -std=c++17 -Wall -Wextra -Werror -Icrates/ttl-live-native/include crates/ttl-live-native/tests/smoke.c -L"$libdir" -lttl_live -Wl,-rpath,"$libdir" -o /tmp/ttl-native-cpp
          /tmp/ttl-native-cpp
          if [ "$RUNNER_OS" = Linux ]; then
            python scripts/native/check-exports.py "$libdir/libttl_live.so"
            python sdk/dotnet/tools/check-abi-coverage.py --library "$libdir/libttl_live.so"
          else
            python scripts/native/check-exports.py "$libdir/libttl_live.dylib"
            python sdk/dotnet/tools/check-abi-coverage.py --library "$libdir/libttl_live.dylib"
          fi
      - name: Verify Windows C and C++ linkage
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /W4 /WX /Icrates\ttl-live-native\include crates\ttl-live-native\tests\smoke.c target\${{ matrix.target }}\release\ttl_live.dll.lib /Fe:ttl-native-c.exe
          copy target\${{ matrix.target }}\release\ttl_live.dll .
          ttl-native-c.exe
          cl /nologo /W4 /WX /TP /Icrates\ttl-live-native\include crates\ttl-live-native\tests\smoke.c target\${{ matrix.target }}\release\ttl_live.dll.lib /Fe:ttl-native-cpp.exe
          ttl-native-cpp.exe
          python sdk/dotnet/tools/check-abi-coverage.py --library target\${{ matrix.target }}\release\ttl_live.dll
      - name: Stage libraries and curated headers
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, shutil
          out=pathlib.Path('native-package')
          out.mkdir(exist_ok=True)
          built=pathlib.Path('target/${{ matrix.target }}/release')
          for name in ['ttl_live.lib','ttl_live.dll','ttl_live.dll.lib','libttl_live.a','libttl_live.so','libttl_live.dylib']:
              if (built/name).exists(): shutil.copy2(built/name,out/name)
          shutil.copytree('crates/ttl-live-native/include',out/'include',dirs_exist_ok=True)
          shutil.copy2('crates/ttl-live-native/README.md',out/'README.md')
          shutil.copy2('crates/ttl-live-native/LICENSE',out/'LICENSE')
          notices=out/'protobuf-license'
          notices.mkdir(exist_ok=True)
          for name in ['LICENSE.upstream','README.md','UPSTREAM']:
              shutil.copy2(pathlib.Path('crates/ttl-live-proto')/name,notices/name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ttl-live-${{ matrix.target }}
          path: native-package/
  dotnet-package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: ttl-live-*
          path: native-artifacts
          merge-multiple: false
      - name: Assemble all NuGet native runtime assets
        run: python3 sdk/dotnet/tools/stage-native-assets.py native-artifacts
      - name: Pack the cross-platform NuGet package
        run: dotnet pack sdk/dotnet/src/Ttl.Live/Ttl.Live.csproj --configuration Release --output dotnet-package
      - name: Validate package runtime and managed assets
        run: python3 sdk/dotnet/tools/verify-nupkg.py dotnet-package/Ttl.Live.0.1.0.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: ttl-live-dotnet-nuget
          path: dotnet-package/*
  nuget-consumer:
    needs: dotnet-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ttl-live-dotnet-nuget
          path: ${{ runner.temp }}/ttl-live-package
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and run a consumer using this RID's packaged native library
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/ttl-live-package
          CONSUMER_DIR: ${{ runner.temp }}/ttl-live-package-consumer
        run: |
          mkdir -p "$CONSUMER_DIR"
          cat > "$CONSUMER_DIR/Consumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Ttl.Live" Version="0.1.0" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$CONSUMER_DIR/Program.cs" <<'EOF'
          using Ttl.Live;
          NativeLibraryInfo native = TikTokLiveClient.NativeLibrary;
          if (native.AbiVersion != 1) throw new Exception("Unexpected native ABI version.");
          Console.WriteLine($"ABI={native.AbiVersion} Version={native.Version}");
          EOF
          dotnet restore "$CONSUMER_DIR/Consumer.csproj" --source "$PACKAGE_DIR"
          dotnet run --project "$CONSUMER_DIR/Consumer.csproj" --configuration Release --no-restore
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Instrumented event and FFI fuzz smoke
        run: |
          cargo fuzz run event_envelope -- -max_total_time=30 -max_len=65536
          cargo fuzz run native_decode -- -max_total_time=30 -max_len=65536

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Instrument native callback and destruction tests
        env:
          RUSTFLAGS: '-Zsanitizer=thread'
          RUSTDOCFLAGS: '-Zsanitizer=thread'
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p ttl-live-native --lib
