name: webview-compatibility

on:
  workflow_dispatch:

jobs:
  compile-webview-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: Compile optional oracle and live server
        run: |
          cargo check -p ttl-sign-webview --all-targets
          cargo check -p ttl-sign-server --all-features --all-targets
          cargo check -p ttl-sign-lab --all-features --all-targets
